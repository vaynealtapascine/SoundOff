name: Android release
on:
  push:
    tags: ['android/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to validate/build (android/v0.5.0); manual runs do not publish'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: python scripts/android_release.py "$RELEASE_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Test and build release APK
        run: |
          python -m unittest discover -s scripts -p test_android_release.py -v
          bash android/gradlew -p android testDebugUnitTest lintRelease assembleRelease
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing Android signing secret: $name"; exit 1; fi
          done
          umask 077
          keystore="$RUNNER_TEMP/soundoff-android.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p dist
          apk="dist/SoundOff-Android-$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cp android/VERIFICATION.md dist/ANDROID-VERIFICATION.md
      - uses: actions/upload-artifact@v4
        with:
          name: SoundOff-Android-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-release-check-reports
          path: android/app/build/reports/

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SoundOff-Android-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish Android stream
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "SoundOff Android $VERSION" \
            --notes-file .github/ANDROID-RELEASE-NOTES.md \
            --latest=false --verify-tag "${args[@]}"
