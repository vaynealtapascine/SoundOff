name: Android
on:
  push:
    branches: ['**']
    paths: ['android/**', 'scripts/test_android.py', 'scripts/android_release.py', 'scripts/test_android_release.py', '.github/workflows/android-release.yml', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/test_android.py', 'scripts/android_release.py', 'scripts/test_android_release.py', '.github/workflows/android-release.yml', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Check release version validation
        run: python -m unittest discover -s scripts -p test_android_release.py -v
      - name: Build and check
        working-directory: android
        run: bash gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoundOff-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: android/app/build/reports/
